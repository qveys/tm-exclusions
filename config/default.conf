# ── SCAN PRUNE ZONES (prune) ─────────────────────────────────

#@Prune zones
prune|$HOME/Library|System library — subdirs handled by static rules
prune|$HOME/.Trash|Trash directory
prune|$HOME/.bun|Bun runtime — handled by static rules
# Shadow copies left by package-manager reinstalls/migrations. They are not
# static exclusions (the live tree is already covered); prune them so the
# dynamic scan does not emit one exclusion per nested dist/node_modules (#25).
prune|$HOME/.bun.bak|Bun reinstall backup — skip scan of regenerable shadow copy
prune|$HOME/.bun.old|Bun previous install — skip scan of regenerable shadow copy
prune|$HOME/.npm.bak|npm reinstall backup — skip scan of regenerable shadow copy
prune|$HOME/.npm.old|npm previous install — skip scan of regenerable shadow copy
prune|$HOME/.yarn.bak|Yarn reinstall backup — skip scan of regenerable shadow copy
prune|$HOME/.yarn.old|Yarn previous install — skip scan of regenerable shadow copy
prune|$HOME/.pnpm-store.bak|pnpm store backup — skip scan of regenerable shadow copy
prune|$HOME/.pnpm-store.old|pnpm store previous — skip scan of regenerable shadow copy
prune|$HOME/.cargo.bak|Cargo backup — skip scan of regenerable shadow copy
prune|$HOME/.cargo.old|Cargo previous install — skip scan of regenerable shadow copy
prune|$HOME/.nvm|nvm versions — handled by static rules
prune|$HOME/.cursor/extensions|Cursor extensions — handled by static rules
prune|$HOME/.vscode/extensions|VS Code extensions — handled by static rules
prune|$HOME/.local/share/uv|uv data — handled by static rules
prune|$HOME/.local/pipx|pipx venvs — handled by static rules
prune|$HOME/.bmad/cache|BMAD cache — handled by static rules
prune|$HOME/.ollama/models|Ollama models — handled by static rules

# Optional large VM/disk image discovery (disabled by default):
