# Exclude bulky CoreSimulator subtrees, not the parent directory: root-level
# plists and device state stay in backups. Devices is opt-in below.
# keep rules in custom.conf can protect additional paths.
# Apply/dry-run/uninstall drop a leftover parent tmutil exclusion from older
# catalogs (manual: tmutil removeexclusion "$HOME/Library/Developer/CoreSimulator").
path|$HOME/Library/Developer/CoreSimulator/Caches|Simulator caches
path|$HOME/Library/Developer/CoreSimulator/Temp|Simulator temp
path|$HOME/Library/Developer/CoreSimulator/Volumes|Simulator runtime images (Xcode 15+)
# Opt-in (may contain persistent user data):
# path|$HOME/Library/Developer/CoreSimulator/Devices|iOS Simulator device containers
# System CoreSimulator is runtime images, not user device metadata — keep whole tree.
path|/Library/Developer/CoreSimulator|System CoreSimulator

#@macOS Caches
path|$HOME/Library/Caches|App caches — auto-regenerated
