# ════════════════════════════════════════════════════════════════
#  tm-exclusions — default.conf
#  Built-in exclusion rules for developer Macs.
#  Criterion: regenerable content (cache, install, build, models…).
#
#  Format: type|target|reason
#    type    = path | pattern | prune
#    target  = $HOME/... (preferred) or absolute path
#    reason  = short human-readable note shown in report
#
#  Variables: $HOME expanded at load time (~ also accepted, legacy).
#  Sections: lines starting with `#@` are treated as comments by the 1.x
#  loader; they are cosmetic today and reserved for future category-aware
#  reporting (#34).
# ════════════════════════════════════════════════════════════════

# ── STATIC EXCLUSIONS (path) ─────────────────────────────────

#@Applications
path|/Applications|Apps — reinstallable
path|$HOME/Applications|User apps

#@Node.js / JavaScript
path|$HOME/.npm|npm cache and config
path|$HOME/.yarn/cache|Yarn cache
path|$HOME/.yarn/berry/cache|Yarn Berry cache
path|$HOME/.pnpm-store|pnpm store
path|$HOME/Library/pnpm|pnpm global
path|$HOME/.local/share/pnpm|pnpm data
path|$HOME/.bun|Bun runtime + packages
path|$HOME/.nvm|nvm versions

#@Python
path|$HOME/.cache/pip|pip download cache
path|$HOME/Library/Python|macOS system Python — site-packages
path|$HOME/.local/share/virtualenvs|pipenv envs
path|$HOME/.local/share/uv|uv tools + cache
path|$HOME/.uv|uv config/data
path|$HOME/.local/pipx|pipx venvs
path|$HOME/.pyenv/versions|pyenv versions
path|$HOME/.conda|Conda envs
path|$HOME/miniconda3|Miniconda
path|$HOME/anaconda3|Anaconda
path|$HOME/miniforge3|Miniforge

#@Docker
# $HOME/.docker is intentionally kept in backups: it is small and contains
# config.json (registry auth tokens). Bulky data is covered by the rules below.
path|$HOME/Library/Containers/com.docker.docker|Docker Desktop data
path|$HOME/Library/Group Containers/group.com.docker|Docker group containers
path|$HOME/Library/Application Support/Docker Desktop|Docker Desktop support

#@Homebrew
path|/opt/homebrew|Homebrew (Apple Silicon) — reinstallable via brew bundle
path|/usr/local/Cellar|Homebrew Cellar (Intel)
# $HOME/Library/Caches/Homebrew is covered by the macOS Caches parent rule.

#@Rust / Cargo
path|$HOME/.cargo/registry|Cargo crate registry
path|$HOME/.cargo/git|Cargo git sources
path|$HOME/.rustup/toolchains|rustup toolchains

#@Java / JVM
path|$HOME/.m2/repository|Maven cache
path|$HOME/.gradle/caches|Gradle cache
path|$HOME/.gradle/wrapper|Gradle wrapper distributions
path|$HOME/.ivy2/cache|Ivy cache
path|$HOME/.sbt|SBT cache
path|$HOME/.coursier/cache|Coursier cache

#@Go
path|$HOME/go/pkg/mod|Go module cache
path|$HOME/.cache/go-build|Go build cache

#@Ruby / iOS
path|$HOME/.rbenv/versions|Ruby rbenv versions
path|$HOME/.rvm|RVM
path|$HOME/.gem|Ruby gems
path|$HOME/.cocoapods|CocoaPods repo

#@Xcode / Apple Dev Tools
path|$HOME/Library/Developer/Xcode/DerivedData|DerivedData — auto-rebuilt
path|$HOME/Library/Developer/Xcode/Archives|Xcode archives
path|$HOME/Library/Developer/Xcode/iOS DeviceSupport|iOS Device Support
path|$HOME/Library/Developer/Xcode/watchOS DeviceSupport|watchOS Device Support
path|$HOME/Library/Developer/Xcode/tvOS DeviceSupport|tvOS Device Support
path|$HOME/Library/Developer/Xcode/visionOS DeviceSupport|visionOS Device Support
path|$HOME/Library/Developer/Xcode/Products|Xcode build products
path|$HOME/Library/Developer/CoreSimulator|iOS Simulator data
path|/Library/Developer/CoreSimulator|System CoreSimulator

#@macOS Caches
path|$HOME/Library/Caches|App caches — auto-regenerated
path|$HOME/Library/Logs|App logs
path|/private/var/folders|macOS per-user kernel temp caches (regenerable)

#@Dev Tools
path|$HOME/.cursor/extensions|Cursor extensions — reinstallable
path|$HOME/.vscode/extensions|VS Code extensions — reinstallable
path|$HOME/.bmad/cache|BMAD cache
path|$HOME/.terraform.d/plugin-cache|Terraform plugin cache
path|$HOME/.pulumi|Pulumi cache
path|$HOME/.helm|Helm chart cache
path|$HOME/.kube/cache|kubectl cache
# JetBrains, VS Code, and VS Code Insiders cache directories under
# $HOME/Library/Caches are covered by the macOS Caches parent rule.

#@AI / LLM
path|$HOME/.cache/huggingface|Hugging Face model cache
path|$HOME/.cache/lm-studio|LM Studio model cache
path|$HOME/.ollama/models|Ollama models — re-downloadable (parent .ollama keeps id_ed25519 + history)
path|$HOME/Library/Application Support/Claude/vm_bundles|Claude Code VM images
path|$HOME/Library/Application Support/Claude/local-agent-mode-sessions|Claude agent ephemeral sessions
path|$HOME/Library/Application Support/superwhisper/models|SuperWhisper — models re-downloadable

#@App Support
# Application Support roots mix user data (settings, keymaps, sessions) with
# regenerable caches/extensions. Excluding the parent risks data loss on
# restore, so all entries below ship commented (opt-in). Re-enable a line
# only after confirming the app's specific layout is cache-only.
# path|$HOME/Library/Application Support/Antigravity|Antigravity — internal data regenerated
# path|$HOME/Library/Application Support/auto-claude-ui|Auto Claude UI — venvs regenerated
# path|$HOME/Library/Application Support/Cursor|Cursor — globalStorage/extensions regenerated
# path|$HOME/Library/Application Support/discord|Discord — Electron modules regenerated
# path|$HOME/Library/Application Support/GitKrakenCLI|GitKraken CLI — cache regenerated
# path|$HOME/Library/Application Support/JetBrains|JetBrains — plugins/caches regenerated
# path|$HOME/Library/Application Support/virtualenv|virtualenv — data regenerated
# path|$HOME/Library/Application Support/vscode-sqltools|SQLTools — node_modules regenerated
# path|$HOME/Library/Application Support/Zed|Zed — extensions/languages regenerated

# ── DYNAMIC SCAN PATTERNS (pattern) ──────────────────────────

#@Node.js / JavaScript
pattern|node_modules|Node.js dependencies (regenerable via npm/yarn install)
pattern|.next|Next.js build cache
pattern|.nuxt|Nuxt.js build
pattern|.turbo|Turborepo cache
pattern|.parcel-cache|Parcel cache
pattern|.svelte-kit|SvelteKit build
pattern|.astro|Astro build
pattern|.output|Build output (Nuxt/Nitro)
pattern|dist|Build distribution output
pattern|build|Build output directory

#@Python
pattern|.venv|Python virtual environment
pattern|venv|Python virtual environment
pattern|python-venv|Python virtual environment (alt)
pattern|virtualenv|Python virtual environment (alt)
pattern|.virtualenv|Python virtual environment (alt)
pattern|__pycache__|Python bytecode cache
pattern|.pytest_cache|pytest cache
pattern|.mypy_cache|mypy cache
pattern|.ruff_cache|ruff cache
pattern|.tox|tox environments
pattern|.eggs|Python egg artifacts
pattern|site-packages|Python lib/pythonX.Y/site-packages trees (regenerable pip output: tool installs, brew, pyenv, …)

#@Rust / Cargo
pattern|target|Rust/Cargo build output

#@Java / JVM
pattern|.gradle|Gradle project cache

#@Ruby / iOS
pattern|Pods|CocoaPods dependencies

#@Claude Code / Codex
pattern|.auto-claude|Auto-Claude — ephemeral worktrees/sessions
pattern|.codex|Codex — ephemeral worktrees/sessions
pattern|worktrees|git/Claude worktrees — ephemeral copies

#@Generic caches
# pattern|.cache|Generic cache (opt-in: too broad by default)

# ── SCAN PRUNE ZONES (prune) ─────────────────────────────────

#@Prune zones
prune|$HOME/Library|System library — subdirs handled by static rules
prune|$HOME/.Trash|Trash directory
prune|$HOME/.bun|Bun runtime — handled by static rules
prune|$HOME/.nvm|nvm versions — handled by static rules
prune|$HOME/.cursor/extensions|Cursor extensions — handled by static rules
prune|$HOME/.vscode/extensions|VS Code extensions — handled by static rules
prune|$HOME/.local/share/uv|uv data — handled by static rules
prune|$HOME/.local/pipx|pipx venvs — handled by static rules
prune|$HOME/.bmad/cache|BMAD cache — handled by static rules
prune|$HOME/.ollama/models|Ollama models — handled by static rules
