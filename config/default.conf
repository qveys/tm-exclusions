#@IDE and Dev Tool Caches
# Selective regenerable caches under ~/Library/Application Support (#53).
# Parent app folders mix settings, keymaps, tokens, and sessions with caches
# — those roots stay in backups. $HOME/Library is a prune zone, so these
# must be static path rules (dynamic patterns never see them).
#
# Path targets may include a glob segment (e.g. JetBrains/*/plugins) so
# versioned IDE folders are covered without listing every release.

# Cursor (VS Code fork) — keep User/settings.json, keybindings, History,
# globalStorage and workspaceStorage (chat/state). Electron caches regenerate.
# Opt-in (may contain persistent user data):
# path|$HOME/Library/Application Support/Cursor/User/workspaceStorage|Cursor workspaceStorage — regenerable
path|$HOME/Library/Application Support/Cursor/Cache|Cursor Chromium cache
path|$HOME/Library/Application Support/Cursor/CachedData|Cursor V8 cached data
path|$HOME/Library/Application Support/Cursor/CachedExtensionVSIXs|Cursor cached VSIX downloads
path|$HOME/Library/Application Support/Cursor/Code Cache|Cursor V8 code cache
path|$HOME/Library/Application Support/Cursor/GPUCache|Cursor GPU cache

# Antigravity (VS Code-based; folder is Antigravity or Antigravity IDE)
# Opt-in (may contain persistent user data):
# path|$HOME/Library/Application Support/Antigravity/User/workspaceStorage|Antigravity workspaceStorage — regenerable
path|$HOME/Library/Application Support/Antigravity/Cache|Antigravity Chromium cache
path|$HOME/Library/Application Support/Antigravity/CachedData|Antigravity V8 cached data
path|$HOME/Library/Application Support/Antigravity/CachedExtensionVSIXs|Antigravity cached VSIX downloads
path|$HOME/Library/Application Support/Antigravity/Code Cache|Antigravity V8 code cache
path|$HOME/Library/Application Support/Antigravity/GPUCache|Antigravity GPU cache
# Opt-in (may contain persistent user data):
# path|$HOME/Library/Application Support/Antigravity IDE/User/workspaceStorage|Antigravity IDE workspaceStorage — regenerable
path|$HOME/Library/Application Support/Antigravity IDE/Cache|Antigravity IDE Chromium cache
path|$HOME/Library/Application Support/Antigravity IDE/CachedData|Antigravity IDE V8 cached data
path|$HOME/Library/Application Support/Antigravity IDE/CachedExtensionVSIXs|Antigravity IDE cached VSIX downloads
path|$HOME/Library/Application Support/Antigravity IDE/Code Cache|Antigravity IDE V8 code cache
path|$HOME/Library/Application Support/Antigravity IDE/GPUCache|Antigravity IDE GPU cache

# Auto Claude UI — venvs only (settings stay in the parent)
path|$HOME/Library/Application Support/auto-claude-ui/.venv|Auto Claude UI venv — regenerated
path|$HOME/Library/Application Support/auto-claude-ui/python-venv|Auto Claude UI python-venv — regenerated

# Discord — keep Local Storage / Cookies (auth tokens)
path|$HOME/Library/Application Support/discord/Cache|Discord Chromium cache
path|$HOME/Library/Application Support/discord/Code Cache|Discord V8 code cache
path|$HOME/Library/Application Support/discord/GPUCache|Discord GPU cache
path|$HOME/Library/Application Support/discord/modules|Discord Electron modules — re-downloaded

# GitKraken CLI — keep parent (auth); versions/ is cached cores
path|$HOME/Library/Application Support/GitKrakenCLI/versions|GitKraken CLI cached cores — re-downloaded
path|$HOME/Library/Application Support/GitKrakenCLI/cache|GitKraken CLI cache — regenerated

# JetBrains — plugins reinstallable; options/keymaps/scratches stay
path|$HOME/Library/Application Support/JetBrains/*/plugins|JetBrains IDE plugins — reinstallable
path|$HOME/Library/Application Support/JetBrains/Toolbox/apps|JetBrains Toolbox downloaded IDEs — reinstallable

# virtualenv tool cache (interpreter discovery / wheels — not project venvs)
path|$HOME/Library/Application Support/virtualenv|virtualenv discovery/wheel cache — regenerated

# SQLTools language server deps
path|$HOME/Library/Application Support/vscode-sqltools/node_modules|SQLTools node_modules — regenerated

# Zed — settings live in ~/.config/zed; languages/extensions/node re-download
path|$HOME/Library/Application Support/Zed/languages|Zed language servers — re-downloaded
path|$HOME/Library/Application Support/Zed/extensions|Zed extensions — reinstallable
path|$HOME/Library/Application Support/Zed/node|Zed bundled Node runtime — re-downloaded

