# EXAMPLE extra config for cloud-sync prunes.
#
# Activate by copying to your own location and setting:
#   export TM_EXCLUSIONS_EXTRA_CONF=/path/to/extra.conf
#
# Or append these entries directly to your user config:
#   ~/.config/tm_exclusions/custom.conf
#
# Format: type|target|reason
# Types: path (static path), pattern (directory name for scan), prune (skip during scan)
#
# These prune entries skip dynamic scan results whose path falls under the
# given prefix. They do NOT add a Time Machine exclusion for the root itself —
# cloud-sync trees contain user data that you may want backed up.
# Only enable what applies to your setup.

# Uncomment to skip dynamic scan results under Dropbox:
#prune|$HOME/Dropbox|Cloud-sync tree — skip regenerable sub-directories from scan

# Uncomment to skip dynamic scan results under Google Drive:
#prune|$HOME/Google Drive|Cloud-sync tree — skip regenerable sub-directories from scan

# Uncomment to skip dynamic scan results under OneDrive:
#prune|$HOME/OneDrive|Cloud-sync tree — skip regenerable sub-directories from scan
