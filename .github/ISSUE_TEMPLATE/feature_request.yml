name: 🌟 Feature request
description: Suggest a new feature or enhancement.
title: "🌟 feat: <short description>"
labels: ["✨ Type: Feature", "🟢 Status: Triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion. Please describe the use case before the solution — that helps decide whether the change fits the project's scope (small, dependency-free Bash 3.2 CLI on stock macOS).

  - type: textarea
    id: problem
    attributes:
      label: Problem / use case
      description: What are you trying to do, and what's blocking you today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would the ideal behaviour look like? CLI surface, config keys, default rules, etc.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Workarounds, related tools, prior discussion.

  - type: checkboxes
    id: terms
    attributes:
      label: Pre-submission checklist
      options:
        - label: I searched [existing issues](https://github.com/qveys/tm-exclusions/issues?q=is%3Aissue) before opening this one.
          required: true
        - label: This stays within scope (Bash 3.2, no external runtime deps).
          required: true
