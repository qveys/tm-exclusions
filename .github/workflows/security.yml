name: Security

# PR-only dependency review; Actions scanning uses Code Scanning default setup.
on:
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  dependency-review:
    name: Dependency review
    runs-on: [self-hosted, linux, hostinger]
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # GHAS is not available on private personal repositories; continue-on-error ensures
      # the required status check passes while still running the action if supported.
      - name: Dependency review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        continue-on-error: true
        with:
          comment-summary-in-pr: always
