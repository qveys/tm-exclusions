name: Release

# On tag v*, create/update GitHub Release with notes from CHANGELOG.md
# and bump Formula/tm-exclusions.rb in qveys/homebrew-tools.
# Repository secret: HOMEBREW_TOKEN — PAT with repo scope on qveys/homebrew-tools

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to re-sync to the tap (e.g. v1.2.0)"
        required: true
        type: string

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: [self-hosted, linux, hostinger]
    steps:
      - name: Generate Housekeeper App Token
        id: app-token
        if: ${{ env.HAS_APP_KEY != '' }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.HOUSEKEEPER_APP_ID || '4537342' }}
          private-key: ${{ secrets.HOUSEKEEPER_PRIVATE_KEY }}
        env:
          HAS_APP_KEY: ${{ secrets.HOUSEKEEPER_PRIVATE_KEY }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          token: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}

      - name: Extract version
        id: version
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          TAG="${INPUT_TAG:-$GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Extract release notes from CHANGELOG.md
        id: notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          NOTES_FILE="release_notes.md"
          awk -v ver="$VERSION" '
            $0 ~ "^## (v)?" ver "([[:space:]]|$)" { found=1; next }
            found && /^## / { found=0 }
            found { print }
          ' CHANGELOG.md > "$NOTES_FILE"
          if [ -s "$NOTES_FILE" ] && grep -q '[^[:space:]]' "$NOTES_FILE"; then
            echo "has_notes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_notes=false" >> "$GITHUB_OUTPUT"
            rm -f "$NOTES_FILE"
          fi

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
          HAS_NOTES: ${{ steps.notes.outputs.has_notes }}
        run: |
          if [ "$HAS_NOTES" = "true" ]; then
            if gh release view "$TAG" >/dev/null 2>&1; then
              gh release edit "$TAG" --title "tm-exclusions $TAG" --notes-file release_notes.md
            else
              gh release create "$TAG" --title "tm-exclusions $TAG" --notes-file release_notes.md
            fi
          else
            if gh release view "$TAG" >/dev/null 2>&1; then
              gh release edit "$TAG" --title "tm-exclusions $TAG" --generate-notes
            else
              gh release create "$TAG" --title "tm-exclusions $TAG" --generate-notes
            fi
          fi

      - name: Compute tarball SHA256
        id: sha256
        env:
          TAG: ${{ steps.version.outputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          URL="https://github.com/${REPO}/archive/refs/tags/${TAG}.tar.gz"
          curl --fail --retry 5 --retry-delay 3 -sSL "$URL" -o release.tar.gz
          SHA256="$(sha256sum release.tar.gz | awk '{print $1}')"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"

      - name: Update Homebrew tap
        env:
          HOMEBREW_TOKEN: ${{ secrets.HOMEBREW_TOKEN || secrets.RELEASE_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
          URL: ${{ steps.sha256.outputs.url }}
          SHA256: ${{ steps.sha256.outputs.sha256 }}
        run: |
          if [ -z "${HOMEBREW_TOKEN:-}" ]; then
            echo "HOMEBREW_TOKEN not set; skipping tap bump."
            exit 0
          fi
          git clone "https://x-access-token:${HOMEBREW_TOKEN}@github.com/qveys/homebrew-tools.git" tap
          test -f Formula/tm-exclusions.rb || { echo "ERROR: Formula/tm-exclusions.rb missing in this repo"; exit 1; }
          # Fully sync the formula from this repo so the install stanza never drifts
          install -m 644 Formula/tm-exclusions.rb tap/Formula/tm-exclusions.rb
          cd tap
          sed -i "s|^  url \".*\"|  url \"${URL}\"|" Formula/tm-exclusions.rb
          sed -i "s|^  sha256 \".*\"|  sha256 \"${SHA256}\"|" Formula/tm-exclusions.rb
          sed -i "s|^  version \".*\"|  version \"${VERSION}\"|" Formula/tm-exclusions.rb
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/tm-exclusions.rb
          git diff --staged --quiet && echo "No formula changes" && exit 0
          git commit -m "Update tm-exclusions to ${TAG}"
          git push
